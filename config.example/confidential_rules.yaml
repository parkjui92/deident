# 사업·기술 기밀 규칙.
# pattern 에 캡처 그룹 1이 있으면 그 부분만 치환한다(문맥어는 문서에 남는다).
# context 는 같은 문단·셀에 있어야 하는 말 — 과탐을 막는 안전핀이다.

rules:
  - name: ntis-과제번호
    category: project_no
    # NTIS 세부과제번호 10자리 (17로 시작)
    pattern: '(?<![0-9])(17\d{8})(?![0-9])'

  - name: 과제번호-라벨형
    category: project_no
    # '과제번호: 2026-ABC-001' 처럼 라벨 뒤에 오는 식별자
    pattern: '(?:과제|사업|협약|공고)\s*(?:고유)?번호\s*[:：]?\s*([A-Za-z0-9][A-Za-z0-9\-_]{4,})'

  - name: 연구비-금액
    category: budget
    # 단위어(백만원·억원…)를 요구한다. 맨 '원'까지 잡으면 '2원화' 같은 말이 걸린다.
    # 자릿점이 있는 큰 금액(1,250,000원)은 예외로 인정한다.
    pattern: '([0-9][0-9,\.]*\s*(?:백만원|천만원|억원|만원)|[0-9]{1,3}(?:,[0-9]{3})+\s*원)'
    context: '연구개발비|사업비|연구비|예산|총액|출연금|지원금|소요액|집행'

  - name: 사용자-지정-키워드
    category: confidential
    # 이 문서에서만 가릴 고유 기술명·제품명을 여기에 적는다
    literals: []
